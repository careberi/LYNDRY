name: test

on:
  push:
    branches:
      - main
      - 'audit/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Unit tests import modules that construct external clients even when
      # they never make a network call. Use isolated test values so the suite
      # exercises the normal payment/card gates without touching production.
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      STRIPE_SECRET_KEY: sk_test_lyndry_ci_not_a_real_key

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test
