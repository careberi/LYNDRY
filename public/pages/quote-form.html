<section class="container" style="padding-bottom:72px;">
  <form method="get" action="/quote" class="card card-lg card-xl pricing-address-form">
    <div class="field">
      <label class="field-label" for="pricing-street">Street address</label>
      <input class="input" id="pricing-street" name="street" autocomplete="address-line1" required maxlength="120">
    </div>
    <div class="pricing-address-row">
      <div class="field">
        <label class="field-label" for="pricing-town">Town</label>
        <input class="input" id="pricing-town" name="town" autocomplete="address-level2" required maxlength="80">
      </div>
      <div class="field">
        <label class="field-label" for="pricing-zip">ZIP code</label>
        <input class="input" id="pricing-zip" name="zip" autocomplete="postal-code" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" required>
      </div>
    </div>
    <div style="position:absolute;left:-9999px;" aria-hidden="true">
      <label for="p-company">Company</label>
      <input id="p-company" name="company" tabindex="-1" autocomplete="off">
    </div>
    <button type="submit" class="btn btn-ink btn-full">Check my price {{ICON_ARROW}}</button>
    <p class="pricing-address-hint">We only use this to work out the distance. Nothing is saved and you are not signed up for anything.</p>
  </form>
</section>
