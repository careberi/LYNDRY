<section class="container" style="padding-bottom:72px;">
  <form method="get" action="/quote" class="card card-xl" style="padding:26px 28px;max-width:52ch;" data-reveal>
    <label for="address" style="display:block;font:700 12px/1 var(--font-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-700);margin-bottom:10px;">
      Your street address
    </label>

    <input id="address" name="address" type="text" required
           value="{{ADDRESS_VALUE}}"
           placeholder="16 Chandler Dr, Fair Lawn NJ"
           autocomplete="street-address"
           style="width:100%;margin-bottom:14px;">

    <!-- A hidden field a person never sees. Anything that fills it is not a
         person, and gets the same answer as everybody else. -->
    <div style="position:absolute;left:-9999px;" aria-hidden="true">
      <label for="q-company">Company</label>
      <input id="q-company" name="company" type="text" tabindex="-1" autocomplete="off">
    </div>

    <button type="submit" class="btn btn-ink" style="width:100%;">
      See my price {{ICON_ARROW}}
    </button>

    <p style="font-size:13px;line-height:1.5;color:var(--ink-500);margin:14px 0 0;">
      We only use this to work out the distance. Nothing is saved and you are not
      signed up for anything.
    </p>
  </form>
</section>
